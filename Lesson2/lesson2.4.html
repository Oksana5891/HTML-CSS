<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .wrapper {
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
        }

        .item {
            width: 200px;
            height: 200px;
            background: #22C1C3;
            background: linear-gradient(0deg, rgba(34, 193, 195, 1) 0%, rgba(253, 187, 45, 1) 100%);
            box-shadow: 10px 10px 5px 0 rgba(0, 0, 0, 0.75);
            /*border-radius: 10px;*/
            border-radius: 50%;
            border: 3px solid #22C1C3;
            transition: 1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item a{
            text-decoration: none;
            color: black;
        }

        .item:hover {
            border: 4px solid rgba(253, 187, 45, 1);
            border-radius: 0;
            transition: 1s;
            /*width: 400px;*/
            /*height: 400px;*/
            transform: scale(1.5);
        }

        .item:hover a {
            color: red;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item">
        <a href="#">Link</a>
    </div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>

</body>
</html>
