<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
        }

        *{
            margin: 0;
        }

        .box{
            width: 200px;
            height: 200px;
        }

        .gold{
            background-color: gold;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /*flex-direction: revert; якщо потрібно поміняти місцями*/
        }
        .gold img{
            width: 50%;
        }

        .red{
            background-color: red;
        }

        .blue{
            background-color: blue;
        }

        .flex{
            height: 100%;
            background-color: burlywood;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

<div class="flex">
    <div class="box gold">
        <p>Lorem ipsum dolor.</p>
        <img src="image2/juice-svgrepo-com.svg" alt="apple">
    </div>
    <div class="box red"></div>
    <div class="box blue"></div>
</div>

</body>
</html>
