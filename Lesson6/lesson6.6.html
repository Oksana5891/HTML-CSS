<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        label{
            display: block;
            margin-top: 10px;
        }
        form sup {
            color: red;
        }
        textarea{
            resize: none;
        }
        .form-registration {
            border: 5px solid blue;
            border-radius: 20px;
            width: 30%;
            padding: 20px;
            background-color: #6f9ed1;
        }
        input[type="email"] {
            background-color: yellow;
            border: 3px solid #5e5e04;
            border-radius: 20px;
        }
        input[type="email"]::placeholder {
            color: blue;
        }
        input[type="text"]:focus {
            border: 5px solid black;
        }
    </style>
</head>
<body>

<form class="form-registration">

    <label for="name">First Name</label>
    <input type="text" name="name" id="name" placeholder="Anna" required> <sup>*</sup>

    <label for="email">Enter your email</label>
    <input type="email" name="email" id="email" placeholder="example@gmail.com" required> <sup>*</sup>

    <label for="password">Create your password</label>
    <input type="password" name="password" id="password" placeholder="qwerty" required> <sup>*</sup>

    <label for="age">Enter your age</label>
    <input type="number" name="age" id="age" min="18" max="100">

    <label>Стать</label>
    <label><input type="radio" name="gender" value="male">Чоловіча</label>
    <label><input type="radio" name="gender" value="female">Жіноча</label>

    <label>
        <input type="checkbox" name="newsletter" value="newsletter" > Підписатись на новини
    </label>

    <label for="country">Country</label>
    <select id="country">
        <option value="">Choose country</option>
        <option value="Ukraine">Ukraine</option>
        <option value="Canada">Canada</option>
        <option value="USA">USA</option>
    </select>

    <label for="phone"></label>
    <select id="phone">
       <optgroup label="Apple">
           <option value="15">iPhone 15</option>
           <option value="xs">iPhone XS</option>
           <option value="xr">iPhone XR</option>
       </optgroup>
        <optgroup label="Samsung">
            <option value="s22">Samsung S22</option>
            <option value="s23">Samsung S23</option>
            <option value="s25">Samsung S25</option>
        </optgroup>
    </select>

    <label for="comment"></label>
    <textarea name="comment" id="comment" cols="30" rows="10"></textarea>
    
    <div>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>

</form>

</body>
</html>
